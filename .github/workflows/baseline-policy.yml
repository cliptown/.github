name: baseline policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate organization baseline
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            profile/README.md
            CONTRIBUTING.md
            SECURITY.md
            SUPPORT.md
            CODE_OF_CONDUCT.md
            GOVERNANCE.md
            AGENTS.md
            repository-relationships.json
            organization-policy.json
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error file=$file::required baseline file is missing or empty"; exit 1; }
          done
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.lock'
      - name: Test Rust-first gate with negative cases
        run: cargo test --manifest-path tools/rust-first-gate/Cargo.toml --all-targets
      - name: Enforce Rust-first policy and parse baseline JSON in Rust
        run: cargo run --quiet --manifest-path tools/rust-first-gate/Cargo.toml -- .
